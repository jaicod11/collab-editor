# nixpacks.toml — Railway build/runtime configuration for the SERVER.
#
# Why this file and not `engines`: `engines` in package.json is advisory. Most
# platforms, Railway included, ignore it and pick their own default Node, which
# has been 18 or 20 depending on when the project was created. This project
# cannot run on either.
#
# The server is CommonJS and require()s shared/ot, which is an ESM package
# (Phase 2). require(ESM) is only unflagged from Node 22.12 — on Node 20 the
# process dies at startup with ERR_REQUIRE_ESM before it serves a request.
#
# nixpacks.toml is read by Railway's builder and is authoritative for the
# runtime it provisions, so pinning here is what actually takes effect.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci --prefix server --omit=dev || npm install --prefix server --omit=dev"]

[start]
cmd = "node server/src/index.js"
