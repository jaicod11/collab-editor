# infra/redis.dev.conf
# ─────────────────────────────────────────────────────────────────────────────
# Minimal Redis config for LOCAL DEVELOPMENT ONLY.
#
# Why this exists instead of mounting infra/redis.conf:
#
#   1. infra/redis.conf sets `bind 127.0.0.1 ::1`. Inside a container that binds
#      to the CONTAINER's loopback, so the published host port never reaches it
#      and the stack simply does not work.
#   2. It sets `maxmemory-policy allkeys-lru`. Eviction is exactly what makes
#      Phase 3 behaviour non-deterministic — the op-log cache and the document
#      cache would vanish mid-test for reasons unrelated to the code under test.
#   3. It puts trailing `# comments` on directive lines, which Redis rejects
#      outright ("wrong number of arguments"). As written it cannot be loaded at
#      all, so it is not merely unused — it is broken. Fixing it belongs to the
#      infra hardening phase.
#
# So: infra/redis.conf stays untouched and unmounted, and local dev uses this.
# NOTE: Redis config directives take no trailing comments. Comments get a line.

bind 0.0.0.0

# dev-only: no auth; the container port is published on 127.0.0.1 only
protected-mode no
port 6379

# No eviction. A full cache should error loudly in dev rather than silently
# dropping the very keys a test is asserting on.
maxmemory 256mb
maxmemory-policy noeviction

# Keep the op log durable across container restarts so the catch-up path can be
# exercised after a restart.
appendonly yes
appendfsync everysec
dir /data

# Expiry events, so cache-coherence work can observe key lifetimes.
notify-keyspace-events Ex
